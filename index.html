<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音效库</title>
<style>
:root{--bg:#0f1218;--panel:#151b26;--line:#1f2733;--tx:#dbe2ee;--dim:#7c8798;--dim2:#67748a;--ac:#6ea8fe;--sel:#1b2a45;--selbd:#2f4f8f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line);flex:none}
#q{width:100%;padding:10px 12px;font-size:15px;border-radius:8px;border:1px solid #2a3444;background:var(--panel);color:#eaf0fa;outline:none}
#q:focus{border-color:#3b6fd4;box-shadow:0 0 0 3px #1d3a6e66}
.subbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--dim);gap:12px;flex-wrap:wrap}
#chips{display:flex;gap:6px;flex-wrap:wrap}
#chips span{padding:2px 10px;border:1px solid #2a3444;border-radius:999px;cursor:pointer;color:#93a1b8}
#chips span:hover{border-color:#3b6fd4;color:#cfe0ff}
#hint{color:var(--dim2)}
#viewctl{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim2)}
#viewctl label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
#viewctl input[type=range]{width:84px;accent-color:#6ea8fe}
#viewctl .zr{cursor:pointer;color:var(--dim);padding:0 2px;font-size:13px}
#viewctl .zr:hover{color:#cfe0ff}
#qrow{display:flex;gap:8px;align-items:center}
#qrow #q{flex:1}
#dirwrap{position:relative;flex:none}
#dirbtn{flex:none;padding:9px 12px;font-size:13px;border-radius:8px;border:1px solid #2a3444;background:var(--panel);color:#a9b8d0;cursor:pointer;font-family:inherit;white-space:nowrap}
#dirbtn:hover{border-color:#3b6fd4;color:#cfe0ff}
#dirbtn.act{border-color:#3b6fd4;color:#9fc3ff}
#dirpanel{display:none;position:absolute;right:0;top:calc(100% + 6px);width:430px;max-width:92vw;max-height:62vh;overflow:auto;background:#121826;border:1px solid #2a3444;border-radius:10px;box-shadow:0 12px 40px #000000aa;padding:6px;z-index:30}
#dirpanel.on{display:block}
.drow{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:13px;color:#c6d2e6;cursor:pointer;white-space:nowrap}
.drow:hover{background:#1d2433}
.drow.cur{background:var(--sel);color:#cfe0ff}
.darrow{width:14px;flex:none;color:#7c8798;font-size:10px;text-align:center;cursor:pointer}
.darrow:hover{color:#cfe0ff}
.dname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dmeta{flex:none;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
.dkids{margin-left:14px;border-left:1px solid #1f2733}
.dkids.hide{display:none}
#crumbbar{display:none;padding:2px 0 0;font-size:12px;color:var(--dim)}
#crumbbar.on{display:flex}
#crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#crumb .cseg{cursor:pointer;color:#93a1b8}
#crumb .cseg:hover{color:#cfe0ff}
#crumb .cseg.last{color:#c6d2e6;cursor:default}
#crumb .csep{color:#3a465a}
#crumb #cclear{cursor:pointer;color:#7c8798;margin-left:2px}
#crumb #cclear:hover{color:#ff9a9a}
.sright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#zsort{background:var(--panel);color:#a9b8d0;border:1px solid #2a3444;border-radius:6px;font-size:12px;padding:2px 6px;font-family:inherit;outline:none}
#more{display:none;padding:12px;text-align:center}
#more.on{display:block}
#crumb .ctri{cursor:pointer;color:#4a5a72;font-size:10px;padding:0 1px;user-select:none}
#crumb .ctri:hover{color:#cfe0ff}
#crumbsel{display:none;position:fixed;z-index:35;min-width:280px;max-width:430px;max-height:52vh;overflow:auto;background:#121826;border:1px solid #2a3444;border-radius:10px;box-shadow:0 12px 40px #000000aa;padding:6px}
#crumbsel.on{display:block}
.dstar{flex:none;color:#5a6a82;cursor:pointer;font-size:13px;padding-left:2px}
.dstar:hover{color:#e8c76a}
.dstar.on{color:#e8c76a}
#dirtfav{display:none;border-bottom:1px solid #1f2733;margin-bottom:4px;padding-bottom:4px}
#dirtfav.on{display:block}
.dfavhdr{font-size:11px;color:var(--dim2);padding:4px 8px 2px}
main{flex:1;display:flex;min-height:0}
#list{flex:1;overflow:auto;padding:6px 8px 44px;background:#161b24}
.row{display:flex;align-items:center;gap:10px;padding:2px 8px;border-radius:6px;border:1px solid transparent;margin-bottom:var(--rowgap,8px);background:#0f1218}
.row:hover{background:#1d2433}
.row.sel{background:var(--sel);border-color:var(--selbd)}
.row .wbox{position:relative;flex:none;width:var(--wavew,150px);height:calc(var(--wavew,150px)/10);background:#0b0f16;border-radius:3px;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.row .wbox .w{width:100%;height:100%;display:block;pointer-events:none}
body.vdrag .row{content-visibility:auto;contain-intrinsic-size:calc(max(42px,calc(var(--wavew,150px)/10 + 6px)) - 6px)}
.row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-size:13px;color:#e8eefb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dr{font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sz{font-size:11px;color:var(--dim);flex:none;width:52px;text-align:right}
.row .acts{flex:none;display:none;gap:8px}
.row:hover .acts{display:flex}
.row .acts a,.row .acts b{color:#8fa3c4;cursor:pointer;text-decoration:none;font-weight:400;font-size:13px}
.row .acts a:hover,.row .acts b:hover{color:#cfe0ff}
#empty{display:none;padding:40px 20px;color:var(--dim2);text-align:center;line-height:2}
aside{width:340px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:10px 12px 52px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
#curName{font-size:13px;color:#e8eefb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#curMeta{font-size:11px;color:var(--dim2);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wavebox{position:relative;display:none;background:#0b0f16;border-radius:4px;margin-bottom:2px;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
#wavebox.on{display:block}
#wavebox .w{width:100%;height:auto;display:block;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:#ff5a5a;box-shadow:0 0 5px #ff5a5acc;display:none;pointer-events:none}
.ph.on{display:block}
#tread{font-size:11px;color:var(--dim);margin:0 0 8px;font-variant-numeric:tabular-nums}
#tread b{color:#c6d2e6;font-weight:600}
#pbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:3px 10px;border:1px solid #2a3444;border-radius:6px;cursor:pointer;color:#a9b8d0;font-size:12px;background:none}
.btn:hover{border-color:#3b6fd4;color:#cfe0ff}
.btn.on{border-color:#3b6fd4;color:#9fc3ff}
.btn:disabled{opacity:.5;cursor:default}
#basket h3{margin:0 0 6px;font-size:13px;color:#c6d2e6;font-weight:600}
#basket h3 span{color:var(--dim);font-weight:400}
#blist{max-height:260px;overflow:auto;margin-bottom:8px}
.bitem{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;border-bottom:1px dashed #1c2432}
.bitem .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c6d2e6}
.bitem b{color:#7c8798;cursor:pointer;font-weight:400}
.bitem b:hover{color:#ff9a9a}
.bitem a{color:#7c8798;text-decoration:none;cursor:pointer}
.bitem a:hover{color:#cfe0ff}
#bdest{margin-bottom:8px}
#bdest .dlab{font-size:11px;color:var(--dim2);margin-bottom:4px}
#destPath{width:100%;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid #2a3444;background:#0f1520;color:#cfe0ff;outline:none}
#destPath:focus{border-color:#3b6fd4}
#bactions{display:flex;gap:6px;flex-wrap:wrap}
#bexp{border-color:#2f5aa8;color:#9fc3ff}
#bexp:hover{border-color:#3b6fd4;color:#cfe0ff}
#playToggle{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;padding:6px 16px;border-radius:999px;border:1px solid #2a3444;background:#151b26e6;color:#a9b8d0;font-size:12px;cursor:pointer;box-shadow:0 4px 16px #00000088;font-family:inherit}
#playToggle:hover{border-color:#3b6fd4;color:#cfe0ff}
#playToggle.off{border-color:#5a2f2f;color:#ff9a9a;background:#1f1518e6}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#22304a;color:#dbe7ff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:80vw;text-align:center}
#toast.show{opacity:1}
@media(max-width:860px){main{flex-direction:column}aside{width:auto;border-left:none;border-top:1px solid var(--line)}#list{min-height:40vh}}
</style>
</head>
<body>
<header>
  <div id="qrow">
    <input id="q" placeholder="打字即搜：耳鸣 / explosion / 脚步 / whoosh …" autofocus autocomplete="off" spellcheck="false">
    <div id="dirwrap">
      <button id="dirbtn" title="按目录浏览：商业包 / 合集 / 音乐…">📁 目录 ▾</button>
      <div id="dirpanel"><div id="dirtfav"></div><div id="dirtree"></div></div>
    </div>
  </div>
  <div class="subbar">
    <div id="chips"></div>
    <div class="sright"><div id="subinfo"></div><div>排序 <select id="zsort"><option value="">默认</option><option value="name">路径</option><option value="size">大小</option><option value="mtime">时间</option><option value="rand">随机</option></select></div></div>
  </div>
  <div class="subbar" id="crumbbar"><div id="crumb"></div></div>
  <div class="subbar"><div id="hint">↑↓ 自动试听 · 空格 暂停/继续 · 回车 入篮 · L 循环 · M 播放开关 · Esc 清空 · 点波形跳播</div><div id="viewctl"><label>波形 <input type="range" id="zw" min="120" max="800" step="10" value="150"></label><label>行间距 <input type="range" id="zh" min="0" max="30" step="2" value="8"></label><span class="zr" id="zreset" title="恢复默认大小">↺</span></div><div id="stats"></div></div>
</header>
<main>
  <div id="list"><div id="empty">输入关键词开始搜索<br>支持中文 / 英文 / 中英混合 · 例：耳鸣 · 金属 撞击 · door slam<br>或点右上「📁 目录」按库浏览</div><div id="more"><button class="btn" id="morebtn">加载更多</button></div></div>
  <aside>
    <div class="card" id="player">
      <div id="curName">—</div>
      <div id="curMeta">悬停或 ↑↓ 试听</div>
      <div id="wavebox"><img id="wave" class="w" alt=""><i class="ph" id="wph"></i></div>
      <div id="tread"><b id="tcur">0:00.0</b> / <span id="ttot">--:--</span></div>
      <div id="pbtns">
        <button class="btn" id="btnPlay">▶ 试听</button>
        <button class="btn" id="btnLoop">↻ 循环</button>
        <button class="btn" id="btnDl">⬇ 下载</button>
        <button class="btn" id="btnCp">⧉ 复制路径</button>
        <button class="btn" id="btnAdd">＋ 入篮</button>
        <button class="btn" id="btnDir">📂 到目录</button>
      </div>
    </div>
    <div class="card" id="basket">
      <h3>篮子 <span id="bcount">0</span></h3>
      <div id="blist"></div>
      <div id="bdest">
        <div class="dlab">导出目标（NAS 路径，须在 /volume1/主目录/ 下）</div>
        <input id="destPath" value="/volume1/主目录/Hermes/read/音效导出" autocomplete="off" spellcheck="false">
      </div>
      <div id="bactions">
        <button class="btn" id="bexp" title="把篮子里的文件直接复制到 NAS 目标文件夹（共享盘里马上能看到）">导出到文件夹</button>
        <button class="btn" id="bzip" title="打包成一个 ZIP 下载：解压后所有文件都在同一目录（重名自动加后缀）">下载 ZIP</button>
        <button class="btn" id="bcopy">复制路径</button>
        <button class="btn" id="bclear">清空</button>
      </div>
    </div>
  </aside>
</main>
<div id="crumbsel"></div>
<audio id="au"></audio>
<div id="toast"></div>
<button id="playToggle" title="全局播放开关：关掉后悬停/点击/键盘都不会出声；可按 M 切换">🔊 播放开</button>
<script>
"use strict";
var API="";
var UNC_BASE="\\\\192.168.3.65\\主目录\\";
var CHIPS=["耳鸣","爆炸","转场","脚步","风","雨","金属","心跳","whoosh","impact"];
var results=[],sel=-1,curId=null,playSrc=null,loop=false,muted=false,hintShown=false,reqSeq=0,hoverT=0,stopT=0;
var $=function(s){return document.querySelector(s)};
var au=$("#au");

/* ---------- 视图缩放（波形大小 / 行间距，存 localStorage） ---------- */
var wavew=150,rowgap=8;
try{
  var _w=parseInt(localStorage.getItem("sfx_wavew"),10);if(_w>=120&&_w<=800)wavew=_w;
  var _g=parseInt(localStorage.getItem("sfx_rowgap"),10);if(_g>=0&&_g<=30)rowgap=_g;
}catch(e){}
function applyViewNow(){
  var s=document.documentElement.style;
  s.setProperty("--wavew",wavew+"px");s.setProperty("--rowgap",rowgap+"px");
}
var viewRaf=null,viewSaveT=null;
function scheduleView(){
  if(viewRaf==null)viewRaf=requestAnimationFrame(function(){viewRaf=null;applyViewNow();});
  if(viewSaveT)clearTimeout(viewSaveT);
  viewSaveT=setTimeout(saveView,500);
}
function saveView(){
  if(viewSaveT){clearTimeout(viewSaveT);viewSaveT=null;}
  try{localStorage.setItem("sfx_wavew",wavew);localStorage.setItem("sfx_rowgap",rowgap);}catch(e){}
}
$("#zw").addEventListener("input",function(){wavew=+this.value;scheduleView();});
$("#zh").addEventListener("input",function(){rowgap=+this.value;scheduleView();});
$("#zw").addEventListener("change",saveView);
$("#zh").addEventListener("change",saveView);
$("#zreset").onclick=function(){wavew=150;rowgap=8;$("#zw").value=150;$("#zh").value=8;saveView();applyViewNow();};
/* 拖动滑杆期间：屏外行 content-visibility 跳过渲染（拖动丝滑；松手恢复全渲染） */
(function(){
  var off=function(){document.body.classList.remove("vdrag");};
  ["zw","zh"].forEach(function(id){
    $("#"+id).addEventListener("pointerdown",function(){document.body.classList.add("vdrag");});
  });
  document.addEventListener("pointerup",off);
  document.addEventListener("pointercancel",off);
})();
$("#zw").value=wavew;$("#zh").value=rowgap;
applyViewNow();

function fmtSize(n){return n>1e9?(n/1e9).toFixed(1)+"G":n>1e6?(n/1e6).toFixed(1)+"M":n>1e3?Math.round(n/1e3)+"K":n+"B";}
function uncFor(rel){return UNC_BASE+rel.replace(/\//g,"\\");}
function toast(msg,ms){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show")},ms||1800);}
function showHint(){if(!hintShown){hintShown=true;toast("浏览器要求先点一下页面才能出声（随便点一下即可）");}}
document.addEventListener("click",function(){hintShown=false;});

function copyText(t,msg){
  var done=function(){toast(msg||"已复制")};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,function(){legacy(t,done)});}
  else{legacy(t,done);}
}
function legacy(t,done){
  var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){toast("复制失败，请手动复制");}
  ta.remove();
}

/* ---------- 搜索 / 目录浏览 ---------- */
var curDir="",sortMode="";
var EMPTY_HTML=$("#empty").innerHTML;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function runSearch(fresh){
  var q=$("#q").value.trim(),seq=++reqSeq;
  if(fresh&&!q&&!curDir){results=[];sel=-1;renderPage([],0,true);updateInfo(0,0);setMore(false,0,0);setEmptyState();return;}
  var offset=fresh?0:results.length;
  if(!fresh)$("#morebtn").textContent="加载中…";
  var url=API+"/api/search?q="+encodeURIComponent(q)+"&dir="+encodeURIComponent(curDir)+"&offset="+offset+"&sort="+encodeURIComponent(sortMode);
  fetch(url).then(function(r){return r.json()}).then(function(resp){
    if(seq!==reqSeq)return;
    var items=resp.results||[],startI;
    if(fresh){results=items;startI=0;}
    else{startI=results.length;results=results.concat(items);}
    sel=results.findIndex(function(x){return x.id===curId});
    renderPage(items,startI,fresh);
    updateInfo(resp.total,results.length);
    setMore(items.length>0&&results.length<resp.total,resp.total,results.length);
    setEmptyState();
  }).catch(function(){if(!fresh)$("#morebtn").textContent="加载失败，点击重试";});
}
function renderPage(items,startI,fresh){
  var list=$("#list");
  if(fresh)list.querySelectorAll(".row").forEach(function(x){x.remove()});
  var frag=document.createDocumentFragment();
  items.forEach(function(it,i){
    var d=document.createElement("div");
    d.className="row";d.dataset.i=startI+i;d.dataset.id=it.id;
    d.innerHTML='<div class="wbox"><img class="w" loading="lazy" alt="" src="/api/wave?id='+it.id+"&v="+it.mtime+'&r=2"><i class="ph"></i></div>'+
      '<div class="meta"><div class="nm"></div><div class="dr"></div></div>'+
      '<div class="sz">'+fmtSize(it.size)+'</div>'+
      '<div class="acts"><a href="/api/audio?id='+it.id+"&dl=1"+'" title="下载">⬇</a><b class="cp" title="复制 UNC 路径">⧉</b><b class="add" title="入篮">＋</b><b class="gone" title="进入所在目录">📂</b></div>';
    d.querySelector(".nm").textContent=it.name;
    d.querySelector(".dr").textContent=it.dir;
    var w=d.querySelector(".w");w.onerror=function(){this.style.visibility="hidden"};
    frag.appendChild(d);
  });
  list.insertBefore(frag,$("#more"));
  paintSel();
  phBind();
}
function updateInfo(total,shown){
  var q=$("#q").value.trim(),parts=[];
  if(curDir)parts.push("📁 "+curDir.split("/").pop());
  if(q||curDir){parts.push("共 "+total.toLocaleString()+" 条");if(shown<total)parts.push("已显示 "+shown.toLocaleString());}
  $("#subinfo").textContent=parts.join(" · ");
}
function setMore(show,total,shown){
  var m=$("#more");
  m.classList.toggle("on",!!show);
  if(show)$("#morebtn").textContent="加载更多（还有 "+(total-shown).toLocaleString()+" 条）";
}
function setEmptyState(){
  var q=$("#q").value.trim(),e=$("#empty");
  if(results.length){e.style.display="none";return;}
  if(!q&&!curDir){e.innerHTML=EMPTY_HTML;}
  else{e.innerHTML="没有找到结果"+(q?("："+esc(q)):"")+(curDir?("<br>范围：📁 "+esc(curDir)):"");}
  e.style.display="block";
}
$("#morebtn").onclick=function(){runSearch(false);};
/* ---------- 目录选择器 ---------- */
var dirKids={},dirRootLoaded=false;
function fetchDirs(under,cb){
  if(dirKids[under]){cb(dirKids[under]);return;}
  fetch(API+"/api/dirs?under="+encodeURIComponent(under)).then(function(r){return r.json()}).then(function(resp){
    dirKids[under]=resp.kids||[];
    cb(dirKids[under]);
  }).catch(function(){toast("目录加载失败");});
}
/* 目录行工厂：面板 / 收藏 / 面包屑下拉 共用 */
function dirRow(k,opts){
  opts=opts||{};
  var row=document.createElement("div");
  row.className="drow"+(k.path===curDir?" cur":"");
  row.dataset.path=k.path;
  var ar=null;
  if(opts.arrow!==false){
    ar=document.createElement("span");ar.className="darrow";ar.textContent=k.has?"▸":"·";
    row.appendChild(ar);
  }
  var nm=document.createElement("span");nm.className="dname";nm.textContent=k.name;row.appendChild(nm);
  var mt=document.createElement("span");mt.className="dmeta";mt.textContent=k.n.toLocaleString()+" · "+fmtSize(k.s);row.appendChild(mt);
  if(opts.star){
    var on=isFav(k.path);
    var st=document.createElement("span");st.className="dstar"+(on?" on":"");st.textContent=on?"★":"☆";st.title="收藏 / 取消收藏";
    st.onclick=function(e){e.stopPropagation();toggleFav(k);};
    row.appendChild(st);
  }
  return {row:row,arrow:ar};
}
function renderDirKids(box,kids){
  kids.forEach(function(k){
    var rr=dirRow(k,{star:true}),row=rr.row,ar=rr.arrow;
    var kidsBox=null;
    if(k.has&&ar){
      kidsBox=document.createElement("div");kidsBox.className="dkids hide";
      ar.onclick=function(e){
        e.stopPropagation();
        if(kidsBox.dataset.loaded==="1"){
          kidsBox.classList.toggle("hide");
          ar.textContent=kidsBox.classList.contains("hide")?"▸":"▾";
          return;
        }
        ar.textContent="…";
        fetchDirs(k.path,function(list){
          kidsBox.dataset.loaded="1";
          renderDirKids(kidsBox,list);
          kidsBox.classList.remove("hide");
          ar.textContent="▾";
        });
      };
    }
    row.onclick=function(e){
      if(e.target===ar)return;
      setDir(k.path);
      closeDirPanel();
    };
    box.appendChild(row);
    if(kidsBox)box.appendChild(kidsBox);
  });
}
function openDirPanel(){
  $("#dirpanel").classList.add("on");
  renderFavs();
  if(!dirRootLoaded){
    fetchDirs("",function(list){
      dirRootLoaded=true;
      renderDirKids($("#dirtree"),list);
    });
  }
}
function closeDirPanel(){$("#dirpanel").classList.remove("on");}
/* ---------- 目录收藏（localStorage） ---------- */
var favs=[];
try{favs=JSON.parse(localStorage.getItem("sfxdirfavs")||"[]")||[];}catch(e){favs=[];}
function saveFavs(){try{localStorage.setItem("sfxdirfavs",JSON.stringify(favs));}catch(e){}}
function isFav(p){return favs.some(function(x){return x.p===p;});}
function toggleFav(k){
  var i=favs.findIndex(function(x){return x.p===k.path;});
  if(i>=0){favs.splice(i,1);toast("已取消收藏");}
  else{favs.push({p:k.path,n:k.n,s:k.s});toast("已收藏 ✓");}
  saveFavs();renderFavs();syncStars();
}
function syncStars(){
  document.querySelectorAll("#dirpanel .drow[data-path]").forEach(function(r){
    var st=r.querySelector(".dstar");if(!st)return;
    var on=isFav(r.dataset.path);st.classList.toggle("on",on);st.textContent=on?"★":"☆";
  });
}
function renderFavs(){
  var box=$("#dirtfav");
  if(!favs.length){box.classList.remove("on");box.innerHTML="";return;}
  box.classList.add("on");box.innerHTML="";
  var h=document.createElement("div");h.className="dfavhdr";h.textContent="⭐ 收藏";box.appendChild(h);
  favs.slice().sort(function(a,b){return a.p<b.p?-1:1;}).forEach(function(f){
    var k={path:f.p,name:f.p.split("/").pop(),n:f.n||0,s:f.s||0,has:false};
    var r=dirRow(k,{arrow:false,star:true}).row;
    r.onclick=function(){setDir(f.p);closeDirPanel();};
    box.appendChild(r);
  });
}
/* ---------- 面包屑逐层换路径 ---------- */
var crumbSelAnchor=null;
function openCrumbSel(level,el){
  var segs=curDir?curDir.split("/"):[];
  var parent=level===0?"":segs.slice(0,level-1).join("/");
  var current=level===0?"":segs[level-1];
  crumbSelAnchor=el;
  fetchDirs(parent,function(list){
    if(crumbSelAnchor!==el)return;
    var box=$("#crumbsel");
    box.innerHTML="";
    if(!list.length){
      var d=document.createElement("div");d.className="drow";d.textContent="（没有下级目录）";box.appendChild(d);
    }
    list.forEach(function(k){
      var r=dirRow(k,{arrow:false,star:false}).row;
      if(k.path===current)r.classList.add("cur");
      r.onclick=function(){setDir(k.path);};
      box.appendChild(r);
    });
    var rect=el.getBoundingClientRect();
    box.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-430))+"px";
    box.style.top=(rect.bottom+4)+"px";
    box.classList.add("on");
  });
}
function closeCrumbSel(){$("#crumbsel").classList.remove("on");crumbSelAnchor=null;}
function toggleCrumbSel(level,el){
  if($("#crumbsel").classList.contains("on")&&crumbSelAnchor===el){closeCrumbSel();return;}
  openCrumbSel(level,el);
}
$("#dirbtn").onclick=function(e){e.stopPropagation();$("#dirpanel").classList.contains("on")?closeDirPanel():openDirPanel();};
document.addEventListener("click",function(e){
  if(!e.target.closest("#dirwrap"))closeDirPanel();
  if(!e.target.closest("#crumbsel")&&!e.target.closest("#crumb"))closeCrumbSel();
});
$("#zsort").addEventListener("change",function(){sortMode=this.value;runSearch(true);});
function updatePlaceholder(){
  var el=$("#q");
  if(curDir){el.placeholder="在 "+curDir.split("/").pop()+" 内搜索…（留空=浏览该目录全部）";}
  else{el.placeholder="打字即搜：耳鸣 / explosion / 脚步 / whoosh …";}
}
function updateCrumb(){
  var cb=$("#crumbbar"),c=$("#crumb");
  if(!curDir){cb.classList.remove("on");c.innerHTML="";closeCrumbSel();return;}
  cb.classList.add("on");c.innerHTML="";
  var segs=curDir.split("/");
  var root=document.createElement("span");root.className="cseg";root.textContent="全库";
  root.onclick=function(){setDir("");};
  c.appendChild(root);
  var rt=document.createElement("span");rt.className="ctri";rt.textContent="▾";rt.title="换一个桶";
  rt.onclick=(function(lv){return function(e){e.stopPropagation();toggleCrumbSel(lv,this);};})(0);
  c.appendChild(rt);
  segs.forEach(function(sg,i){
    var sep=document.createElement("span");sep.className="csep";sep.textContent="›";c.appendChild(sep);
    var s=document.createElement("span");
    var last=(i===segs.length-1);
    s.className="cseg"+(last?" last":"");
    s.textContent=sg;
    if(!last){s.onclick=(function(p){return function(){setDir(p);};})(segs.slice(0,i+1).join("/"));}
    c.appendChild(s);
    var tr=document.createElement("span");tr.className="ctri";tr.textContent="▾";tr.title="换一个目录";
    tr.onclick=(function(lv){return function(e){e.stopPropagation();toggleCrumbSel(lv,this);};})(i+1);
    c.appendChild(tr);
  });
  var x=document.createElement("b");x.id="cclear";x.textContent="✕";x.title="回到全库搜索";
  x.onclick=function(){setDir("");};
  c.appendChild(x);
}
function setDir(p){
  curDir=p||"";
  closeCrumbSel();
  updateCrumb();updatePlaceholder();
  $("#dirbtn").classList.toggle("act",!!curDir);
  document.querySelectorAll("#dirpanel .drow").forEach(function(r){r.classList.toggle("cur",r.dataset.path===curDir);});
  runSearch(true);
}
function enterDirOf(it){
  if(!it)return;
  var d=it.dir||"";
  if(!d){toast("该文件直接在库根下");return;}
  $("#q").value="";
  setDir(d);
}

function paintSel(){
  document.querySelectorAll("#list .row").forEach(function(r){r.classList.toggle("sel",+r.dataset.i===sel)});
}
function ensureVisible(){
  var r=document.querySelector('#list .row[data-i="'+sel+'"]');
  if(r)r.scrollIntoView({block:"nearest"});
}

/* ---------- 播放 ---------- */
function playRow(i,toggle,src){
  if(i<0||i>=results.length)return;
  sel=i;paintSel();ensureVisible();
  var it=results[i];
  $("#curName").textContent=it.name;
  $("#curMeta").textContent=(it.dir?it.dir+" · ":"")+fmtSize(it.size);
  var wb=$("#wavebox");wb.classList.add("on");
  var w=$("#wave");var wsrc="/api/wave?id="+it.id+"&v="+it.mtime+"&r=2";
  if(w.getAttribute("src")!==wsrc)w.src=wsrc;
  if(curId!==it.id){
    curId=it.id;playSrc=src||"click";
    if(pend&&pend.id!==curId)pend=null;
    $("#tcur").textContent="0:00.0";$("#ttot").textContent="--:--";
    if(muted){au.pause();if(src==="click")muteGate();}
    else{au.src="/api/audio?id="+it.id;au.play().catch(function(){showHint()});}
  }else{
    if(src)playSrc=src;
    if(muted){if(toggle)muteGate();}
    else if(toggle){au.paused?au.play().catch(function(){showHint()}):au.pause();}
    else if(au.paused){au.play().catch(function(){showHint()});}
  }
  phBind();
  syncPlayBtn();
}
function stopAudio(){au.pause();syncPlayBtn();}
function syncPlayBtn(){$("#btnPlay").textContent=au.paused?"▶ 试听":"⏸ 暂停";}

/* ---------- 播放头 / 时间读数 / 点击跳播 ---------- */
var phEl=null,rafId=null,pend=null,drag=null,lastSeekT=0;
function fmtTime(t){if(!isFinite(t)||t<0)t=0;var h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;var ss=(s<10?"0":"")+s.toFixed(1);return h>0?h+":"+("0"+m).slice(-2)+":"+ss:m+":"+ss;}
function phBind(){
  if(phEl){phEl.classList.remove("on");phEl=null;}
  var wph=$("#wph");if(wph)wph.classList.remove("on");
  if(muted||curId==null)return;
  var box=document.querySelector('#list .row[data-id="'+curId+'"] .wbox');
  if(box){phEl=box.querySelector(".ph");if(phEl)phEl.classList.add("on");}
  if($("#wavebox").classList.contains("on")&&wph)wph.classList.add("on");
  phPaint();
}
function phPaint(){
  var frac=(curId!=null&&isFinite(au.duration)&&au.duration>0)?au.currentTime/au.duration:0;
  if(phEl)phEl.style.left=(frac*100)+"%";
  var wph=$("#wph");if(wph)wph.style.left=(frac*100)+"%";
  if(curId!=null&&au.getAttribute("src")){
    $("#tcur").textContent=fmtTime(au.currentTime);
    $("#ttot").textContent=(isFinite(au.duration)&&au.duration>0)?fmtTime(au.duration):"--:--";
  }
}
function tick(){phPaint();rafId=au.paused?null:requestAnimationFrame(tick);}
function kick(){if(rafId==null&&!au.paused)rafId=requestAnimationFrame(tick);}
function applyPend(){if(pend&&pend.id===curId&&isFinite(au.duration)&&au.duration>0){au.currentTime=pend.f*au.duration;pend=null;}}
function dragSeek(e){
  if(!drag)return;
  var r=drag.box.getBoundingClientRect();
  if(r.width<=0)return;
  var frac=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  var ph=drag.panel?$("#wph"):drag.box.querySelector(".ph");
  if(ph){ph.classList.add("on");ph.style.left=(frac*100)+"%";}
  if(!drag.panel)phEl=ph;
  var now=performance.now();
  if(now-lastSeekT<120)return;
  lastSeekT=now;
  if(drag.id!==curId||!(isFinite(au.duration)&&au.duration>0)){pend={id:drag.id,f:frac};return;}
  au.currentTime=frac*au.duration;
  if(au.paused)au.play().catch(function(){showHint()});
}
function chooseSeek(id,i,box,e){
  if(muted){muteGate();return;}
  if(curId!==id){
    var idx=results.findIndex(function(x){return x.id===id});
    if(idx<0)return;
    playRow(idx,false,"wave");
  }
  playSrc="click";
  drag={id:id,box:box};
  dragSeek(e);
}
document.addEventListener("pointermove",function(e){if(drag)dragSeek(e);});
document.addEventListener("pointerup",function(){drag=null;});
document.addEventListener("pointercancel",function(){drag=null;});
au.addEventListener("play",function(){syncPlayBtn();kick();phPaint();});
au.addEventListener("pause",function(){syncPlayBtn();phPaint();});
au.addEventListener("loadedmetadata",function(){applyPend();phPaint();});
au.addEventListener("seeked",function(){phPaint();});
au.addEventListener("emptied",function(){phPaint();});

/* ---------- 列表交互 ---------- */
var list=$("#list");
list.addEventListener("mouseover",function(e){
  if(drag)return;
  var row=e.target.closest(".row");if(!row)return;
  clearTimeout(stopT);
  var i=+row.dataset.i;
  if(i===sel)return;
  clearTimeout(hoverT);
  hoverT=setTimeout(function(){playRow(i,false,"hover")},120);
});
list.addEventListener("mouseleave",function(){
  if(drag)return;
  clearTimeout(hoverT);
  clearTimeout(stopT);
  stopT=setTimeout(function(){if(playSrc==="hover")stopAudio()},350);
});
list.addEventListener("click",function(e){
  var row=e.target.closest(".row");if(!row)return;
  var i=+row.dataset.i;
  if(e.target.closest(".cp")){copyText(uncFor(results[i].rel),"已复制路径");return;}
  if(e.target.closest(".add")){addBasket(results[i]);return;}
  if(e.target.closest(".gone")){enterDirOf(results[i]);return;}
  if(e.target.closest("a"))return;
  if(e.target.closest(".wbox"))return;
  playRow(i,true,"click");
});
list.addEventListener("pointerdown",function(e){
  var box=e.target.closest(".wbox");if(!box)return;
  var row=box.closest(".row");if(!row)return;
  e.preventDefault();
  chooseSeek(+row.dataset.id,+row.dataset.i,box,e);
});
$("#wavebox").addEventListener("pointerdown",function(e){
  if(curId==null)return;
  e.preventDefault();
  if(muted){muteGate();return;}
  playSrc="click";
  drag={id:curId,box:this,panel:true};
  dragSeek(e);
});

/* ---------- 键盘 ---------- */
document.addEventListener("keydown",function(e){
  if(e.isComposing)return;
  var ae=document.activeElement||{};
  var inq=ae.id==="q";
  var inOtherInput=(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&!inq;
  if((e.key==="ArrowDown"||e.key==="ArrowUp")&&!inOtherInput){
    e.preventDefault();
    if(!results.length)return;
    sel=Math.max(0,Math.min(results.length-1,sel+(e.key==="ArrowDown"?1:-1)));
    playRow(sel,false,"kb");
    return;
  }
  if(e.key==="Enter"&&!inOtherInput){
    if(sel>=0){addBasket(results[sel]);}
    else if(results.length){toast("↑↓ 选一条，回车入篮");}
    return;
  }
  if(e.key===" "){if(inq||inOtherInput)return;e.preventDefault();if(curId){if(muted){muteGate();}else{au.paused?au.play().catch(function(){showHint()}):au.pause();}}return;}
  if((e.key==="l"||e.key==="L")&&!inq&&!inOtherInput){loop=!loop;au.loop=loop;$("#btnLoop").classList.toggle("on",loop);return;}
  if((e.key==="m"||e.key==="M")&&!inq&&!inOtherInput){toggleMute();return;}
  if(e.key==="Escape"){
    if($("#crumbsel").classList.contains("on")){closeCrumbSel();return;}
    if($("#dirpanel").classList.contains("on")){closeDirPanel();return;}
    if(inq||inOtherInput){ae.blur();}else{$("#q").value="";runSearch(true);}
    return;
  }
  if(e.key==="/"&&!inq&&!inOtherInput){e.preventDefault();$("#q").focus();return;}
});

/* ---------- 播放器面板 ---------- */
$("#btnPlay").onclick=function(){if(!curId)return;if(muted){muteGate();return;}au.paused?au.play().catch(function(){showHint()}):au.pause();};
$("#btnLoop").onclick=function(){loop=!loop;au.loop=loop;this.classList.toggle("on",loop);};
$("#btnDl").onclick=function(){if(curId)location.href="/api/audio?id="+curId+"&dl=1";};
$("#btnCp").onclick=function(){if(sel>=0)copyText(uncFor(results[sel].rel),"已复制路径");};
$("#btnAdd").onclick=function(){if(sel>=0)addBasket(results[sel]);};
$("#btnDir").onclick=function(){if(sel>=0)enterDirOf(results[sel]);};

/* ---------- 篮子 ---------- */
var basket=[];
try{basket=JSON.parse(localStorage.getItem("sfxbasket")||"[]")||[];}catch(e){basket=[];}
function saveB(){try{localStorage.setItem("sfxbasket",JSON.stringify(basket));}catch(e){}}
function addBasket(it){
  if(basket.some(function(x){return x.id===it.id})){toast("已在篮子");return;}
  basket.push({id:it.id,name:it.name,rel:it.rel,size:it.size});
  saveB();renderB();toast("已入篮 ✓");
}
function renderB(){
  $("#bcount").textContent=basket.length;
  var box=$("#blist");box.innerHTML="";
  basket.forEach(function(x,i){
    var d=document.createElement("div");d.className="bitem";
    var n=document.createElement("div");n.className="bn";n.textContent=x.name;n.title=x.rel;
    var a=document.createElement("a");a.textContent="⬇";a.title="下载这个";a.href="/api/audio?id="+x.id+"&dl=1";
    var b=document.createElement("b");b.textContent="✕";b.title="移除";
    b.onclick=function(){basket.splice(i,1);saveB();renderB();};
    d.appendChild(n);d.appendChild(a);d.appendChild(b);box.appendChild(d);
  });
}
$("#bcopy").onclick=function(){if(!basket.length)return toast("篮子是空的");copyText(basket.map(function(x){return uncFor(x.rel)}).join("\n"),"已复制 "+basket.length+" 条路径");};
$("#bzip").onclick=function(){if(!basket.length)return toast("篮子是空的");location.href="/api/zip?ids="+basket.map(function(x){return x.id}).join(",");};
$("#bclear").onclick=function(){basket=[];saveB();renderB();};

/* ---------- 导出到文件夹 ---------- */
var DEST_KEY="sfxdest";
var destEl=$("#destPath");
try{if(localStorage.getItem(DEST_KEY))destEl.value=localStorage.getItem(DEST_KEY);}catch(e){}
destEl.addEventListener("change",function(){try{localStorage.setItem(DEST_KEY,destEl.value.trim());}catch(e){}});
$("#bexp").onclick=function(){
  if(!basket.length)return toast("篮子是空的");
  var dest=destEl.value.trim();
  if(!dest)return toast("先填导出目标文件夹");
  try{localStorage.setItem(DEST_KEY,dest);}catch(e){}
  var btn=this;btn.disabled=true;var old=btn.textContent;btn.textContent="导出中…";
  fetch(API+"/api/export",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ids:basket.map(function(x){return x.id}),dest:dest})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(res){
    btn.disabled=false;btn.textContent=old;
    if(!res.ok){return toast("导出失败："+(res.j.error||"未知错误"),4000);}
    var m="已导出 "+res.j.copied+" 个文件 → "+res.j.dest;
    if(res.j.renamed)m+="（"+res.j.renamed+" 个重名已加后缀）";
    if(res.j.missing)m+="（"+res.j.missing+" 个无效）";
    toast(m,4500);
  }).catch(function(e){btn.disabled=false;btn.textContent=old;toast("导出失败："+e,4000);});
};

/* ---------- 全局播放开关 ---------- */
var muteHintShown=false;
try{muted=localStorage.getItem("sfxplay")==="0";}catch(e){}
function syncMute(){
  var b=$("#playToggle");
  b.textContent=muted?"🔇 播放关":"🔊 播放开";
  b.classList.toggle("off",muted);
}
function toggleMute(){
  muted=!muted;
  try{localStorage.setItem("sfxplay",muted?"0":"1");}catch(e){}
  if(muted){au.pause();toast("已关闭播放");muteHintShown=false;}
  else{toast("播放已打开");}
  syncMute();
  phBind();
}
function muteGate(){
  if(!muted)return false;
  if(!muteHintShown){muteHintShown=true;toast("播放开关已关（点底部开关 或 按 M 打开）",2600);}
  return true;
}
$("#playToggle").onclick=toggleMute;

/* ---------- 初始化 ---------- */
(function(){
  var chips=$("#chips");
  CHIPS.forEach(function(c){
    var s=document.createElement("span");s.textContent=c;
    s.onclick=function(){$("#q").value=c;$("#q").focus();runSearch(true);};
    chips.appendChild(s);
  });
  fetch(API+"/api/stats").then(function(r){return r.json()}).then(function(s){
    var d=new Date(s.db_mtime*1000);
    $("#stats").textContent="索引 "+s.files.toLocaleString()+" 条 · "+fmtSize(s.bytes)+" · 更新于 "+(s.db_mtime?(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"):"—");
  }).catch(function(){});
  var t=0;
  $("#q").addEventListener("input",function(){clearTimeout(t);t=setTimeout(function(){runSearch(true);},140);});
  renderB();
  syncMute();
  $("#q").focus();
})();
</script>
</body>
