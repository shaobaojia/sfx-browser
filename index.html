<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音效库</title>
<style>
:root{--bg:#0f1218;--panel:#151b26;--line:#1f2733;--tx:#dbe2ee;--dim:#7c8798;--dim2:#67748a;--ac:#6ea8fe;--sel:#1b2a45;--selbd:#2f4f8f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line);flex:none}
#q{width:100%;padding:10px 12px;font-size:15px;border-radius:8px;border:1px solid #2a3444;background:var(--panel);color:#eaf0fa;outline:none}
#q:focus{border-color:#3b6fd4;box-shadow:0 0 0 3px #1d3a6e66}
.subbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--dim);gap:12px;flex-wrap:wrap}
#chips{display:flex;gap:6px;flex-wrap:wrap}
#chips span{padding:2px 10px;border:1px solid #2a3444;border-radius:999px;cursor:pointer;color:#93a1b8}
#chips span:hover{border-color:#3b6fd4;color:#cfe0ff}
#hint{color:var(--dim2)}
#viewctl{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim2)}
#viewctl label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
#viewctl input[type=range]{width:84px;accent-color:#6ea8fe}
#viewctl .zr{cursor:pointer;color:var(--dim);padding:0 2px;font-size:13px}
#viewctl .zr:hover{color:#cfe0ff}
#qrow{display:flex;gap:8px;align-items:center}
#qrow #q{flex:1}
#dirwrap{position:relative;flex:none}
#dirbtn{flex:none;padding:9px 12px;font-size:13px;border-radius:8px;border:1px solid #2a3444;background:var(--panel);color:#a9b8d0;cursor:pointer;font-family:inherit;white-space:nowrap}
#dirbtn:hover{border-color:#3b6fd4;color:#cfe0ff}
#dirbtn.act{border-color:#3b6fd4;color:#9fc3ff}
#dirpanel{display:none;position:absolute;right:0;top:calc(100% + 6px);width:430px;max-width:92vw;max-height:62vh;overflow:auto;background:#121826;border:1px solid #2a3444;border-radius:10px;box-shadow:0 12px 40px #000000aa;padding:6px;z-index:30}
#dirpanel.on{display:block}
.drow{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:13px;color:#c6d2e6;cursor:pointer;white-space:nowrap}
.drow:hover{background:#1d2433}
.drow.cur{background:var(--sel);color:#cfe0ff}
.darrow{width:14px;flex:none;color:#7c8798;font-size:10px;text-align:center;cursor:pointer}
.darrow:hover{color:#cfe0ff}
.dname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dmeta{flex:none;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
.dkids{margin-left:14px;border-left:1px solid #1f2733}
.dkids.hide{display:none}
#crumbbar{display:none;padding:2px 0 0;font-size:12px;color:var(--dim)}
#crumbbar.on{display:flex}
#crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#crumb .cseg{cursor:pointer;color:#93a1b8}
#crumb .cseg:hover{color:#cfe0ff}
#crumb .cseg.last{color:#c6d2e6;cursor:default}
#crumb .csep{color:#3a465a}
#crumb #cclear{cursor:pointer;color:#7c8798;margin-left:2px}
#crumb #cclear:hover{color:#ff9a9a}
.sright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#zsort{background:var(--panel);color:#a9b8d0;border:1px solid #2a3444;border-radius:6px;font-size:12px;padding:2px 6px;font-family:inherit;outline:none}
#more{display:none;padding:12px;text-align:center}
#more.on{display:block}
#crumb .ctri{cursor:pointer;color:#4a5a72;font-size:10px;padding:0 1px;user-select:none}
#crumb .ctri:hover{color:#cfe0ff}
#crumbsel{display:none;position:fixed;z-index:35;min-width:280px;max-width:430px;max-height:52vh;overflow:auto;background:#121826;border:1px solid #2a3444;border-radius:10px;box-shadow:0 12px 40px #000000aa;padding:6px}
#crumbsel.on{display:block}
.dstar{flex:none;color:#5a6a82;cursor:pointer;font-size:13px;padding-left:2px}
.dstar:hover{color:#e8c76a}
.dstar.on{color:#e8c76a}
#dirtfav{display:none;border-bottom:1px solid #1f2733;margin-bottom:4px;padding-bottom:4px}
#dirtfav.on{display:block}
.dfavhdr{font-size:11px;color:var(--dim2);padding:4px 8px 2px}
main{flex:1;display:flex;min-height:0}
#list{flex:1;overflow:auto;padding:6px 8px 44px;background:#161b24}
.row{display:flex;align-items:center;gap:10px;padding:2px 8px;border-radius:6px;border:1px solid transparent;margin-bottom:var(--rowgap,8px);background:#0f1218}
.row:hover{background:#1d2433}
.row.sel{background:var(--sel);border-color:var(--selbd)}
.row .wbox{position:relative;flex:none;width:var(--wavew,150px);height:calc(var(--wavew,150px)/10);background:#0b0f16;border-radius:3px;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.row .wbox .w{width:100%;height:100%;display:block;pointer-events:none}
body.vdrag .row{content-visibility:auto;contain-intrinsic-size:calc(max(42px,calc(var(--wavew,150px)/10 + 6px)) - 6px)}
.row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-size:13px;color:#e8eefb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dr{font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sz{font-size:11px;color:var(--dim);flex:none;width:52px;text-align:right}
.row .acts{flex:none;display:none;gap:8px}
.row:hover .acts{display:flex}
.row .acts a,.row .acts b{color:#8fa3c4;cursor:pointer;text-decoration:none;font-weight:400;font-size:13px}
.row .acts a:hover,.row .acts b:hover{color:#cfe0ff}
#empty{display:none;padding:40px 20px;color:var(--dim2);text-align:center;line-height:2}
aside{width:340px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:10px 12px 52px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
#curName{font-size:13px;color:#e8eefb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#curMeta{font-size:11px;color:var(--dim2);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wavebox{position:relative;display:none;background:#0b0f16;border-radius:4px;margin-bottom:2px;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
#wavebox.on{display:block}
#wavebox .w{width:100%;height:auto;display:block;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:#ff5a5a;box-shadow:0 0 5px #ff5a5acc;display:none;pointer-events:none}
.ph.on{display:block}
#tread{font-size:11px;color:var(--dim);margin:0 0 8px;font-variant-numeric:tabular-nums}
#tread b{color:#c6d2e6;font-weight:600}
#pbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:3px 10px;border:1px solid #2a3444;border-radius:6px;cursor:pointer;color:#a9b8d0;font-size:12px;background:none}
.btn:hover{border-color:#3b6fd4;color:#cfe0ff}
.btn.on{border-color:#3b6fd4;color:#9fc3ff}
.btn:disabled{opacity:.5;cursor:default}
#basket h3{margin:0 0 6px;font-size:13px;color:#c6d2e6;font-weight:600}
#basket h3 span{color:var(--dim);font-weight:400}
#blist{max-height:260px;overflow:auto;margin-bottom:8px}
.bitem{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;border-bottom:1px dashed #1c2432}
.bitem .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c6d2e6}
.bitem b{color:#7c8798;cursor:pointer;font-weight:400}
.bitem b:hover{color:#ff9a9a}
.bitem a{color:#7c8798;text-decoration:none;cursor:pointer}
.bitem a:hover{color:#cfe0ff}
#bdest{margin-bottom:8px}
#bdest .dlab{font-size:11px;color:var(--dim2);margin-bottom:4px}
#destPath{width:100%;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid #2a3444;background:#0f1520;color:#cfe0ff;outline:none}
#destPath:focus{border-color:#3b6fd4}
#bactions{display:flex;gap:6px;flex-wrap:wrap}
#bexp{border-color:#2f5aa8;color:#9fc3ff}
#bexp:hover{border-color:#3b6fd4;color:#cfe0ff}
#playToggle{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;padding:6px 16px;border-radius:999px;border:1px solid #2a3444;background:#151b26e6;color:#a9b8d0;font-size:12px;cursor:pointer;box-shadow:0 4px 16px #00000088;font-family:inherit}
#playToggle:hover{border-color:#3b6fd4;color:#cfe0ff}
#playToggle.off{border-color:#5a2f2f;color:#ff9a9a;background:#1f1518e6}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#22304a;color:#dbe7ff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:80vw;text-align:center}
#toast.show{opacity:1}
@media(max-width:860px){main{flex-direction:column}aside{width:auto;border-left:none;border-top:1px solid var(--line)}#list{min-height:40vh}}
</style>
</head>
<body>
<header>
  <div id="qrow">
    <input id="q" placeholder="打字即搜：耳鸣 / explosion / 脚步 / whoosh …" autofocus autocomplete="off" spellcheck="false">
    <div id="dirwrap">
      <button id="dirbtn" title="按目录浏览：商业包 / 合集 / 音乐…">📁 目录 ▾</button>
      <div id="dirpanel"><div id="dirtfav"></div><div id="dirtree"></div></div>
    </div>
  </div>
  <div class="subbar">
    <div id="chips"></div>
    <div class="sright"><div id="subinfo"></div><div>排序 <select id="zsort"><option value="">默认</option><option value="name">路径</option><option value="size">大小</option><option value="mtime">时间</option><option value="rand">随机</option></select></div></div>
  </div>
  <div class="subbar" id="crumbbar"><div id="crumb"></div></div>
  <div class="subbar"><div id="hint">↑↓ 自动试听 · 空格 暂停/继续 · 回车 入篮 · L 循环 · M 播放开关 · Esc 清空 · 点波形跳播</div><div id="viewctl"><label>波形 <input type="range" id="zw" min="120" max="800" step="10" value="150"></label><label>行间距 <input type="range" id="zh" min="0" max="30" step="2" value="8"></label><span class="zr" id="zreset" title="恢复默认大小">↺</span></div><div id="stats"></div></div>
</header>
<main>
  <div id="list"><div id="empty">输入关键词开始搜索<br>支持中文 / 英文 / 中英混合 · 例：耳鸣 · 金属 撞击 · door slam<br>或点右上「📁 目录」按库浏览</div><div id="more"><button class="btn" id="morebtn">加载更多</button></div></div>
  <aside>
    <div class="card" id="player">
      <div id="curName">—</div>
      <div id="curMeta">悬停或 ↑↓ 试听</div>
      <div id="wavebox"><img id="wave" class="w" alt=""><i class="ph" id="wph"></i></div>
      <div id="tread"><b id="tcur">0:00.0</b> / <span id="ttot">--:--</span></div>
      <div id="pbtns">
        <button class="btn" id="btnPlay">▶ 试听</button>
        <button class="btn" id="btnLoop">↻ 循环</button>
        <button class="btn" id="btnDl">⬇ 下载</button>
        <button class="btn" id="btnCp">⧉ 复制路径</button>
        <button class="btn" id="btnAdd">＋ 入篮</button>
        <button class="btn" id="btnDir">📂 到目录</button>
      </div>
    </div>
    <div class="card" id="basket">
      <h3>篮子 <span id="bcount">0</span></h3>
      <div id="blist"></div>
      <div id="bdest">
        <div class="dlab">导出目标（NAS 路径，须在 /volume1/主目录/ 下）</div>
        <input id="destPath" value="/volume1/主目录/Hermes/read/音效导出" autocomplete="off" spellcheck="false">
      </div>
      <div id="bactions">
        <button class="btn" id="bexp" title="把篮子里的文件直接复制到 NAS 目标文件夹（共享盘里马上能看到）">导出到文件夹</button>
        <button class="btn" id="bzip" title="打包成一个 ZIP 下载：解压后所有文件都在同一目录（重名自动加后缀）">下载 ZIP</button>
        <button class="btn" id="bcopy">复制路径</button>
        <button class="btn" id="bclear">清空</button>
      </div>
    </div>
  </aside>
</main>
<div id="crumbsel"></div>
<audio id="au"></audio>
<div id="toast"></div>
<button id="playToggle" title="全局播放开关：关掉后悬停/点击/键盘都不会出声；可按 M 切换">🔊 播放开</button>
<script>
"use strict";
/* 分区：U 工具 / Store 存储封装 / ViewZoom 视图缩放 / Favs 收藏 / DirPick 目录选择器 / Search 搜索浏览 / Player 播放器 / Basket 篮子 / Mute 播放开关 / 列表交互 / 键盘 / 初始化 */

/* ---------- 常量 ---------- */
var API = "";
var UNC_BASE = "\\\\192.168.3.65\\主目录\\";
var CHIPS = ["耳鸣","爆炸","转场","脚步","风","雨","金属","心跳","whoosh","impact"];
var $ = function(s){return document.querySelector(s)};
var au = $("#au");

/* ---------- U：通用工具 ---------- */
var hintShown = false;
var U = {
  fmtSize: function(n){return n>1e9?(n/1e9).toFixed(1)+"G":n>1e6?(n/1e6).toFixed(1)+"M":n>1e3?Math.round(n/1e3)+"K":n+"B";},
  fmtTime: function(t){if(!isFinite(t)||t<0)t=0;var h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;var ss=(s<10?"0":"")+s.toFixed(1);return h>0?h+":"+("0"+m).slice(-2)+":"+ss:m+":"+ss;},
  uncFor: function(rel){return UNC_BASE+rel.replace(/\//g,"\\");},
  esc: function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");},
  toast: function(msg,ms){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show")},ms||1800);},
  copyText: function(t,msg){
    var done=function(){U.toast(msg||"已复制")};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,function(){U.legacyCopy(t,done)});}
    else{U.legacyCopy(t,done);}
  },
  legacyCopy: function(t,done){
    var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(e){U.toast("复制失败，请手动复制");}
    ta.remove();
  },
  showHint: function(){if(!hintShown){hintShown=true;U.toast("浏览器要求先点一下页面才能出声（随便点一下即可）");}}
};
document.addEventListener("click",function(){hintShown=false;});

/* ---------- Store：localStorage 封装（JSON 读写，异常静默，兼容旧原始值） ---------- */
var Store = {
  get: function(k,d){
    try{
      var v=localStorage.getItem(k);
      if(v===null)return d;
      try{return JSON.parse(v)}catch(e){return v}
    }catch(e){return d}
  },
  set: function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function api(p,opts){return fetch(API+p,opts).then(function(r){return r.json()})}

/* ---------- ViewZoom：视图缩放（波形大小 / 行间距，自包含） ---------- */
(function(){
  var wavew=150,rowgap=8,raf=null,saveT=null;
  var _w=parseInt(Store.get("sfx_wavew",null),10);if(_w>=120&&_w<=800)wavew=_w;
  var _g=parseInt(Store.get("sfx_rowgap",null),10);if(_g>=0&&_g<=30)rowgap=_g;
  function apply(){var s=document.documentElement.style;s.setProperty("--wavew",wavew+"px");s.setProperty("--rowgap",rowgap+"px");}
  function save(){if(saveT){clearTimeout(saveT);saveT=null;}Store.set("sfx_wavew",wavew);Store.set("sfx_rowgap",rowgap);}
  function sched(){if(raf==null)raf=requestAnimationFrame(function(){raf=null;apply();});if(saveT)clearTimeout(saveT);saveT=setTimeout(save,500);}
  $("#zw").addEventListener("input",function(){wavew=+this.value;sched();});
  $("#zh").addEventListener("input",function(){rowgap=+this.value;sched();});
  $("#zw").addEventListener("change",save);
  $("#zh").addEventListener("change",save);
  $("#zreset").onclick=function(){wavew=150;rowgap=8;$("#zw").value=150;$("#zh").value=8;save();apply();};
  ["zw","zh"].forEach(function(id){
    $("#"+id).addEventListener("pointerdown",function(){document.body.classList.add("vdrag");});
  });
  document.addEventListener("pointerup",function(){document.body.classList.remove("vdrag");});
  document.addEventListener("pointercancel",function(){document.body.classList.remove("vdrag");});
  $("#zw").value=wavew;$("#zh").value=rowgap;
  apply();
})();

/* ---------- DirRow：目录行组件（面板 / 收藏 / 面包屑下拉共用） ---------- */
function dirRow(k,opts){
  opts=opts||{};
  var row=document.createElement("div");
  row.className="drow"+(k.path===DirPick.curDir?" cur":"");
  row.dataset.path=k.path;
  var ar=null;
  if(opts.arrow!==false){
    ar=document.createElement("span");ar.className="darrow";ar.textContent=k.has?"▸":"·";
    row.appendChild(ar);
  }
  var nm=document.createElement("span");nm.className="dname";nm.textContent=k.name;row.appendChild(nm);
  var mt=document.createElement("span");mt.className="dmeta";mt.textContent=k.n.toLocaleString()+" · "+U.fmtSize(k.s);row.appendChild(mt);
  if(opts.star){
    var on=Favs.has(k.path);
    var st=document.createElement("span");st.className="dstar"+(on?" on":"");st.textContent=on?"★":"☆";st.title="收藏 / 取消收藏";
    st.onclick=function(e){e.stopPropagation();Favs.toggle(k);};
    row.appendChild(st);
  }
  return {row:row,arrow:ar};
}

/* ---------- Favs：目录收藏（localStorage） ---------- */
var Favs = {
  list: (function(){var v=Store.get("sfxdirfavs",[]);return Array.isArray(v)?v:[];})(),
  save: function(){Store.set("sfxdirfavs",this.list);},
  has: function(p){return this.list.some(function(x){return x.p===p;});},
  toggle: function(k){
    var i=this.list.findIndex(function(x){return x.p===k.path;});
    if(i>=0){this.list.splice(i,1);U.toast("已取消收藏");}
    else{this.list.push({p:k.path,n:k.n,s:k.s});U.toast("已收藏 ✓");}
    this.save();this.render();this.syncStars();
  },
  syncStars: function(){
    document.querySelectorAll("#dirpanel .drow[data-path]").forEach(function(r){
      var st=r.querySelector(".dstar");if(!st)return;
      var on=Favs.has(r.dataset.path);st.classList.toggle("on",on);st.textContent=on?"★":"☆";
    });
  },
  render: function(){
    var box=$("#dirtfav");
    if(!this.list.length){box.classList.remove("on");box.innerHTML="";return;}
    box.classList.add("on");box.innerHTML="";
    var h=document.createElement("div");h.className="dfavhdr";h.textContent="⭐ 收藏";box.appendChild(h);
    this.list.slice().sort(function(a,b){return a.p<b.p?-1:1;}).forEach(function(f){
      var k={path:f.p,name:f.p.split("/").pop(),n:f.n||0,s:f.s||0,has:false};
      var r=dirRow(k,{arrow:false,star:true}).row;
      r.onclick=function(){DirPick.setDir(f.p);DirPick.closePanel();};
      box.appendChild(r);
    });
  }
};

/* ---------- DirPick：目录选择器（面板 / 面包屑 / 逐层换路径） ---------- */
var DirPick = {
  curDir: "",
  kids: {},
  rootLoaded: false,
  selAnchor: null,
  fetch: function(under,cb){
    if(this.kids[under]){cb(this.kids[under]);return;}
    api("/api/dirs?under="+encodeURIComponent(under)).then(function(resp){
      DirPick.kids[under]=resp.kids||[];
      cb(DirPick.kids[under]);
    }).catch(function(){U.toast("目录加载失败");});
  },
  renderKids: function(box,kids){
    kids.forEach(function(k){
      var rr=dirRow(k,{star:true}),row=rr.row,ar=rr.arrow;
      var kidsBox=null;
      if(k.has&&ar){
        kidsBox=document.createElement("div");kidsBox.className="dkids hide";
        ar.onclick=function(e){
          e.stopPropagation();
          if(kidsBox.dataset.loaded==="1"){
            kidsBox.classList.toggle("hide");
            ar.textContent=kidsBox.classList.contains("hide")?"▸":"▾";
            return;
          }
          ar.textContent="…";
          DirPick.fetch(k.path,function(list){
            kidsBox.dataset.loaded="1";

  openPanel: function(){

  closePanel: function(){$("#dirpanel").classList.remove("on");},
  openSel: function(level,el){
    var segs=this.curDir?this.curDir.split("/"):[];

  closeSel: function(){$("#crumbsel").classList.remove("on");this.selAnchor=null;},
  toggleSel: function(level,el){

  updateCrumb: function(){

    if(!this.curDir){cb.classList.remove("on");c.innerHTML="";this.closeSel();return;}
    cb.classList.add("on");c.innerHTML="";

    root.onclick=function(){DirPick.setDir("");};
    c.appendChild(root);
    var rt=document.createElement("span");rt.className="ctri";rt.textContent="▾";rt.title="换一个桶";
    rt.onclick=(function(lv){return function(e){e.stopPropagation();DirPick.toggleSel(lv,this);};})(0);
    c.appendChild(rt);
    segs.forEach(function(sg,i){
      var sep=document.createElement("span");sep.className="csep";sep.textContent="›";c.appendChild(sep);
      var s=document.createElement("span");

      c.appendChild(s);
      var tr=document.createElement("span");tr.className="ctri";tr.textContent="▾";tr.title="换一个目录";

  updatePlaceholder: function(){

  setDir: function(p){

/* ---------- Search：搜索 / 目录浏览（列表渲染 + 分页 + 排序） ---------- */
var Search = {
  results: [],sel: -1,reqSeq: 0,sort: "",
  EMPTY_HTML: $("#empty").innerHTML,
  refresh: function(fresh){
    var q=$("#q").value.trim(),seq=++this.reqSeq;
    if(fresh&&!q&&!DirPick.curDir){
      this.results=[];this.sel=-1;
      this.renderPage([],0,true);this.updateInfo(0,0);this.setMore(false,0,0);this.setEmptyState();
      return;
    }
    var offset=fresh?0:this.results.length;
    if(!fresh)$("#morebtn").textContent="加载中…";
    var url="/api/search?q="+encodeURIComponent(q)+"&dir="+encodeURIComponent(DirPick.curDir)+"&offset="+offset+"&sort="+encodeURIComponent(this.sort);
    api(url).then(function(resp){
      if(seq!==Search.reqSeq)return;
      var items=resp.results||[],startI;
      if(fresh){Search.results=items;startI=0;}
      else{startI=Search.results.length;Search.results=Search.results.concat(items);}
      Search.sel=Search.results.findIndex(function(x){return x.id===Player.curId});
      Search.renderPage(items,startI,fresh);
      Search.updateInfo(resp.total,Search.results.length);
      Search.setMore(items.length>0&&Search.results.length<resp.total,resp.total,Search.results.length);
      Search.setEmptyState();
    }).catch(function(){if(!fresh)$("#morebtn").textContent="加载失败，点击重试";});
  },
  renderPage: function(items,startI,fresh){
    var list=$("#list");
    if(fresh)list.querySelectorAll(".row").forEach(function(x){x.remove()});
    var frag=document.createDocumentFragment();
    items.forEach(function(it,i){
      var d=document.createElement("div");
      d.className="row";d.dataset.i=startI+i;d.dataset.id=it.id;
      d.innerHTML='<div class="wbox"><img class="w" loading="lazy" alt="" src="/api/wave?id='+it.id+"&v="+it.mtime+'&r=2"><i class="ph"></i></div>'+
        '<div class="meta"><div class="nm"></div><div class="dr"></div></div>'+
        '<div class="sz">'+U.fmtSize(it.size)+'</div>'+
        '<div class="acts"><a href="/api/audio?id='+it.id+"&dl=1"+'" title="下载">⬇</a><b class="cp" title="复制 UNC 路径">⧉</b><b class="add" title="入篮">＋</b><b class="gone" title="进入所在目录">📂</b></div>';
      d.querySelector(".nm").textContent=it.name;
      d.querySelector(".dr").textContent=it.dir;
      var w=d.querySelector(".w");w.onerror=function(){this.style.visibility="hidden"};
      frag.appendChild(d);
    });
    list.insertBefore(frag,$("#more"));
    this.paintSel();
    Player.phBind();
  },
  updateInfo: function(total,shown){
    var q=$("#q").value.trim(),parts=[];
    if(DirPick.curDir)parts.push("📁 "+DirPick.curDir.split("/").pop());
    if(q||DirPick.curDir){parts.push("共 "+total.toLocaleString()+" 条");if(shown<total)parts.push("已显示 "+shown.toLocaleString());}
    $("#subinfo").textContent=parts.join(" · ");
  },
  setMore: function(show,total,shown){
    var m=$("#more");
    m.classList.toggle("on",!!show);
    if(show)$("#morebtn").textContent="加载更多（还有 "+(total-shown).toLocaleString()+" 条）";
  },
  setEmptyState: function(){
    var q=$("#q").value.trim(),e=$("#empty");
    if(this.results.length){e.style.display="none";return;}
    if(!q&&!DirPick.curDir){e.innerHTML=this.EMPTY_HTML;}
    else{e.innerHTML="没有找到结果"+(q?("："+U.esc(q)):"")+(DirPick.curDir?("<br>范围：📁 "+U.esc(DirPick.curDir)):"");}
    e.style.display="block";
  },
  paintSel: function(){
    document.querySelectorAll("#list .row").forEach(function(r){r.classList.toggle("sel",+r.dataset.i===Search.sel)});
  },
  ensureVisible: function(){
    var r=document.querySelector('#list .row[data-i="'+Search.sel+'"]');
    if(r)r.scrollIntoView({block:"nearest"});
  },
  select: function(i){this.sel=i;this.paintSel();this.ensureVisible();},
  setSort: function(v){this.sort=v;this.refresh(true);}
};
$("#morebtn").onclick=function(){Search.refresh(false);};
$("#zsort").addEventListener("change",function(){Search.setSort(this.value);});

/* ---------- Player：播放器（试听 / 播放头 / 点击跳播 / 拖动扫播） ---------- */
var Player = {
  curId: null,
  playSrc: null,
  loop: false,
  phEl: null,
  rafId: null,
  pend: null,
  drag: null,
  lastSeekT: 0,
  play: function(i,toggle,src){
    var results=Search.results;
    if(i<0||i>=results.length)return;
    Search.select(i);
    var it=results[i];
    $("#curName").textContent=it.name;
    $("#curMeta").textContent=(it.dir?it.dir+" · ":"")+U.fmtSize(it.size);
    var wb=$("#wavebox");wb.classList.add("on");
    var w=$("#wave");var wsrc="/api/wave?id="+it.id+"&v="+it.mtime+"&r=2";
    if(w.getAttribute("src")!==wsrc)w.src=wsrc;
    if(this.curId!==it.id){
      this.curId=it.id;this.playSrc=src||"click";
      if(this.pend&&this.pend.id!==this.curId)this.pend=null;
      $("#tcur").textContent="0:00.0";$("#ttot").textContent="--:--";
      if(!Mute.on){au.pause();if(src==="click")Mute.gate();}
      else{au.src="/api/audio?id="+it.id;au.play().catch(function(){U.showHint()});}
    }else{
      if(src)this.playSrc=src;
      if(!Mute.on){if(toggle)Mute.gate();}
      else if(toggle){au.paused?au.play().catch(function(){U.showHint()}):au.pause();}
      else if(au.paused){au.play().catch(function(){U.showHint()});}
    }
    this.phBind();
    this.syncBtn();
  },
  stop: function(){au.pause();this.syncBtn();},
  syncBtn: function(){$("#btnPlay").textContent=au.paused?"▶ 试听":"⏸ 暂停";},
  pauseToggle: function(){
    if(this.curId==null)return;
    if(!Mute.on){Mute.gate();return;}
    au.paused?au.play().catch(function(){U.showHint()}):au.pause();
  },
  setLoop: function(v){this.loop=v;au.loop=v;$("#btnLoop").classList.toggle("on",v);},
  phBind: function(){
    if(this.phEl){this.phEl.classList.remove("on");this.phEl=null;}
    var wph=$("#wph");if(wph)wph.classList.remove("on");
    if(!Mute.on||this.curId==null)return;
    var box=document.querySelector('#list .row[data-id="'+this.curId+'"] .wbox');
    if(box){this.phEl=box.querySelector(".ph");if(this.phEl)this.phEl.classList.add("on");}
    if($("#wavebox").classList.contains("on")&&wph)wph.classList.add("on");
    this.phPaint();
  },
  phPaint: function(){
    var frac=(this.curId!=null&&isFinite(au.duration)&&au.duration>0)?au.currentTime/au.duration:0;
    if(this.phEl)this.phEl.style.left=(frac*100)+"%";
    var wph=$("#wph");if(wph)wph.style.left=(frac*100)+"%";
    if(this.curId!=null&&au.getAttribute("src")){
      $("#tcur").textContent=U.fmtTime(au.currentTime);
      $("#ttot").textContent=(isFinite(au.duration)&&au.duration>0)?U.fmtTime(au.duration):"--:--";
    }
  },
  tick: function(){this.phPaint();this.rafId=au.paused?null:requestAnimationFrame(function(){Player.tick();});},
  kick: function(){if(this.rafId==null&&!au.paused)this.rafId=requestAnimationFrame(function(){Player.tick();});},
  applyPend: function(){
    if(this.pend&&this.pend.id===this.curId&&isFinite(au.duration)&&au.duration>0){au.currentTime=this.pend.f*au.duration;this.pend=null;}
  },
  dragSeek: function(e){
    if(!this.drag)return;
    var r=this.drag.box.getBoundingClientRect();
    if(r.width<=0)return;
    var frac=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    var ph=this.drag.panel?$("#wph"):this.drag.box.querySelector(".ph");
    if(ph){ph.classList.add("on");ph.style.left=(frac*100)+"%";}
    if(!this.drag.panel)this.phEl=ph;
    var now=performance.now();
    if(now-this.lastSeekT<120)return;
    this.lastSeekT=now;
    if(this.drag.id!==this.curId||!(isFinite(au.duration)&&au.duration>0)){this.pend={id:this.drag.id,f:frac};return;}
    au.currentTime=frac*au.duration;
    if(au.paused)au.play().catch(function(){U.showHint()});
  },
  seekRow: function(id,i,box,e){
    if(!Mute.on){Mute.gate();return;}
    if(this.curId!==id){
      var idx=Search.results.findIndex(function(x){return x.id===id});
      if(idx<0)return;
      this.play(idx,false,"wave");
    }
    this.playSrc="click";
    this.drag={id:id,box:box};
    this.dragSeek(e);
  },
  seekPanel: function(box,e){
    if(!Mute.on){Mute.gate();return;}
    this.playSrc="click";
    this.drag={id:this.curId,box:box,panel:true};
    this.dragSeek(e);
  },
  init: function(){
    document.addEventListener("pointermove",function(e){if(Player.drag)Player.dragSeek(e);});
    document.addEventListener("pointerup",function(){Player.drag=null;});
    document.addEventListener("pointercancel",function(){Player.drag=null;});
    au.addEventListener("play",function(){Player.syncBtn();Player.kick();Player.phPaint();});
    au.addEventListener("pause",function(){Player.syncBtn();Player.phPaint();});
    au.addEventListener("loadedmetadata",function(){Player.applyPend();Player.phPaint();});
    au.addEventListener("seeked",function(){Player.phPaint();});
    au.addEventListener("emptied",function(){Player.phPaint();});
    $("#btnPlay").onclick=function(){Player.pauseToggle();};
    $("#btnLoop").onclick=function(){Player.setLoop(!Player.loop);};
    $("#btnDl").onclick=function(){if(Player.curId)location.href="/api/audio?id="+Player.curId+"&dl=1";};
    $("#wavebox").addEventListener("pointerdown",function(e){
      if(Player.curId==null)return;
      e.preventDefault();
      Player.seekPanel(this,e);
    });
  }
};

/* ---------- Basket：篮子（导出 / ZIP / 路径复制） ---------- */
var Basket = {
  items: (function(){var v=Store.get("sfxbasket",[]);return Array.isArray(v)?v:[];})(),
  save: function(){Store.set("sfxbasket",this.items);},
  add: function(it){
    if(this.items.some(function(x){return x.id===it.id})){U.toast("已在篮子");return;}
    this.items.push({id:it.id,name:it.name,rel:it.rel,size:it.size});
    this.save();this.render();U.toast("已入篮 ✓");
  },
  render: function(){
    $("#bcount").textContent=this.items.length;
    var box=$("#blist");box.innerHTML="";
    this.items.forEach(function(x,i){
      var d=document.createElement("div");d.className="bitem";
      var n=document.createElement("div");n.className="bn";n.textContent=x.name;n.title=x.rel;
      var a=document.createElement("a");a.textContent="⬇";a.title="下载这个";a.href="/api/audio?id="+x.id+"&dl=1";
      var b=document.createElement("b");b.textContent="✕";b.title="移除";
      b.onclick=function(){Basket.items.splice(i,1);Basket.save();Basket.render();};
      d.appendChild(n);d.appendChild(a);d.appendChild(b);box.appendChild(d);
    });
  },
  copyPaths: function(){
    if(!this.items.length)return U.toast("篮子是空的");
    U.copyText(this.items.map(function(x){return U.uncFor(x.rel)}).join("\n"),"已复制 "+this.items.length+" 条路径");
  },
  downloadZip: function(){
    if(!this.items.length)return U.toast("篮子是空的");
    location.href="/api/zip?ids="+this.items.map(function(x){return x.id}).join(",");
  },
  clear: function(){this.items=[];this.save();this.render();},
  exportTo: function(){
    if(!this.items.length)return U.toast("篮子是空的");
    var destEl=$("#destPath");
    var dest=destEl.value.trim();
    if(!dest)return U.toast("先填导出目标文件夹");
    Store.set("sfxdest",dest);
    var btn=$("#bexp");btn.disabled=true;var old=btn.textContent;btn.textContent="导出中…";
    fetch(API+"/api/export",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ids:this.items.map(function(x){return x.id}),dest:dest})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(res){
      btn.disabled=false;btn.textContent=old;
      if(!res.ok){return U.toast("导出失败："+(res.j.error||"未知错误"),4000);}
      var m="已导出 "+res.j.copied+" 个文件 → "+res.j.dest;
      if(res.j.renamed)m+="（"+res.j.renamed+" 个重名已加后缀）";
      if(res.j.missing)m+="（"+res.j.missing+" 个无效）";
      U.toast(m,4500);
    }).catch(function(e){btn.disabled=false;btn.textContent=old;U.toast("导出失败："+e,4000);});
  },
  init: function(){
    var destEl=$("#destPath");
    var saved=Store.get("sfxdest",null);
    if(saved&&typeof saved==="string")destEl.value=saved;
    destEl.addEventListener("change",function(){Store.set("sfxdest",destEl.value.trim());});
    $("#bcopy").onclick=function(){Basket.copyPaths();};
    $("#bzip").onclick=function(){Basket.downloadZip();};
    $("#bclear").onclick=function(){Basket.clear();};
    $("#bexp").onclick=function(){Basket.exportTo();};
  }
};

/* ---------- Mute：全局播放开关 ---------- */
var Mute = {
  on: true,
  hint: false,
  load: function(){this.on=Store.get("sfxplay",1)!=0;},
  sync: function(){
    var b=$("#playToggle");
    b.textContent=this.on?"🔊 播放开":"🔇 播放关";
    b.classList.toggle("off",!this.on);
  },
  toggle: function(){
    this.on=!this.on;
    Store.set("sfxplay",this.on?1:0);
    if(!this.on){au.pause();U.toast("已关闭播放");this.hint=false;}
    else{U.toast("播放已打开");}
    this.sync();
    Player.phBind();
  },
  gate: function(){
    if(this.on)return false;
    if(!this.hint){this.hint=true;U.toast("播放开关已关（点底部开关 或 按 M 打开）",2600);}
    return true;
  }
};

/* ---------- 列表交互 ---------- */
(function(){
  var list=$("#list"),hoverT=0,stopT=0;
  list.addEventListener("mouseover",function(e){
    if(Player.drag)return;
    var row=e.target.closest(".row");if(!row)return;
    clearTimeout(stopT);
    var i=+row.dataset.i;
    if(i===Search.sel)return;
    clearTimeout(hoverT);
    hoverT=setTimeout(function(){Player.play(i,false,"hover")},120);
  });
  list.addEventListener("mouseleave",function(){
    if(Player.drag)return;
    clearTimeout(hoverT);
    clearTimeout(stopT);
    stopT=setTimeout(function(){if(Player.playSrc==="hover")Player.stop()},350);
  });
  list.addEventListener("click",function(e){
    var row=e.target.closest(".row");if(!row)return;
    var i=+row.dataset.i,it=Search.results[i];
    if(e.target.closest(".cp")){U.copyText(U.uncFor(it.rel),"已复制路径");return;}
    if(e.target.closest(".add")){Basket.add(it);return;}
    if(e.target.closest(".gone")){DirPick.enterDirOf(it);return;}
    if(e.target.closest("a"))return;
    if(e.target.closest(".wbox"))return;
    Player.play(i,true,"click");
  });
  list.addEventListener("pointerdown",function(e){
    var box=e.target.closest(".wbox");if(!box)return;
    var row=box.closest(".row");if(!row)return;
    e.preventDefault();
    Player.seekRow(+row.dataset.id,+row.dataset.i,box,e);
  });
})();

/* ---------- 键盘 ---------- */
(function(){
  document.addEventListener("keydown",function(e){
    if(e.isComposing)return;
    var ae=document.activeElement||{};
    var inq=ae.id==="q";
    var inOtherInput=(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&!inq;
    if((e.key==="ArrowDown"||e.key==="ArrowUp")&&!inOtherInput){
      e.preventDefault();
      var n=Search.results.length;if(!n)return;
      var s=Math.max(0,Math.min(n-1,Search.sel+(e.key==="ArrowDown"?1:-1)));
      Player.play(s,false,"kb");
      return;
    }
    if(e.key==="Enter"&&!inOtherInput){
      if(Search.sel>=0)Basket.add(Search.results[Search.sel]);
      else if(Search.results.length)U.toast("↑↓ 选一条，回车入篮");
      return;
    }
    if(e.key===" "){if(inq||inOtherInput)return;e.preventDefault();Player.pauseToggle();return;}
    if((e.key==="l"||e.key==="L")&&!inq&&!inOtherInput){Player.setLoop(!Player.loop);return;}
    if((e.key==="m"||e.key==="M")&&!inq&&!inOtherInput){Mute.toggle();return;}
    if(e.key==="Escape"){
      if($("#crumbsel").classList.contains("on")){DirPick.closeSel();return;}
      if($("#dirpanel").classList.contains("on")){DirPick.closePanel();return;}
      if(inq||inOtherInput){ae.blur();}else{$("#q").value="";Search.refresh(true);}
      return;
    }
    if(e.key==="/"&&!inq&&!inOtherInput){e.preventDefault();$("#q").focus();return;}
  });
})();

/* ---------- 初始化 ---------- */
(function(){
  Mute.load();Mute.sync();
  $("#playToggle").onclick=function(){Mute.toggle();};
  Basket.init();
  DirPick.init();
  Player.init();
  $("#btnCp").onclick=function(){if(Search.sel>=0)U.copyText(U.uncFor(Search.results[Search.sel].rel),"已复制路径");};
  $("#btnAdd").onclick=function(){if(Search.sel>=0)Basket.add(Search.results[Search.sel]);};
  $("#btnDir").onclick=function(){if(Search.sel>=0)DirPick.enterDirOf(Search.results[Search.sel]);};
  var chips=$("#chips");
  CHIPS.forEach(function(c){
    var s=document.createElement("span");s.textContent=c;
    s.onclick=function(){$("#q").value=c;$("#q").focus();Search.refresh(true);};
    chips.appendChild(s);
  });
  api("/api/stats").then(function(s){
    var d=new Date(s.db_mtime*1000);
    $("#stats").textContent="索引 "+s.files.toLocaleString()+" 条 · "+U.fmtSize(s.bytes)+" · 更新于 "+(s.db_mtime?(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"):"—");
  }).catch(function(){});
  var t=0;
  $("#q").addEventListener("input",function(){clearTimeout(t);t=setTimeout(function(){Search.refresh(true);},140);});
  Basket.render();
  $("#q").focus();
})();

</script>
</body>
</html>
